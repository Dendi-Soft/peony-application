databaseChangeLog:
  - changeSet:
      id: 002-complete-plants-schema
      author: cristi
      comments: >-
        Completes the MVP plant entity from issue #8: adds the tags, care,
        toxicity, and growth fields required by #9's Phase 2 field list, and
        drops the spurious unique constraint on watering_frequency that would
        collide two plants with the same watering interval.
      changes:
        - dropUniqueConstraint:
            tableName: plants
            # Name generated by 001-init-tables for the column's unique constraint
            constraintName: plants_watering_frequency_key
        - addColumn:
            tableName: plants
            columns:
              - column:
                  name: family
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: tags
                  type: TEXT[]
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: light_needs
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: humidity
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: temp_range
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: toxic_to_pets
                  type: BOOLEAN
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: toxic_to_humans
                  type: BOOLEAN
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: difficulty
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: native_region
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: mature_size
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
        - createIndex:
            indexName: idx_plants_tags
            tableName: plants
            using: gin
            columns:
              - column:
                  name: tags
