databaseChangeLog:
  - changeSet:
      id: 002-create-plantnet-species-tables
      author: cristi
      comment: |
        Create persistent storage tables for PlantNet species data.
        These tables store cached API responses as permanent records (not temporary).
        Cache expiration is handled by L1 caffeine/redis layers, NOT these database tables.
        This mitigates the free tier API rate limit (5 requests/minute) by storing
        species information locally after first fetch from PlantNet API.

      changes:
        - createTable:
            tableName: plantnet_species
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: taxon_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: genus
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: species_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: scientific_name
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: authority
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: common_names
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: is_accepted
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: family_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: image_count
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: api_timestamp
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                    unique: false

        - createTable:
            tableName: plantnet_families
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: taxon_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: rank
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: family_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: image_count
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: api_timestamp
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                    unique: false

        - addForeignKeyConstraint:
            baseTableName: plantnet_species
            baseColumnNames: family_id
            referencedTableName: plantnet_families
            referencedColumnNames: taxon_id
            constraintName: fk_species_family
            onDeleteRestrict: true
            onUpdateRestrict: true

  - changeSet:
      id: 003-create-search-results-table
      author: cristi
      comment: |
        Create persistent storage table for search results.
        This is permanent storage, NOT a temporary cache. Cache expiration is handled
        by L1 caffeine/redis layers, not this database table.
        Caches repeated taxonomy queries to avoid redundant API calls.

      changes:
        - createTable:
            tableName: plantnet_search_cache
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: query
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: query_timestamp
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: results_count
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: search_results_json
                  type: TEXT
                  constraints:
                    nullable: true
                    unique: false

        - createIndex:
            indexName: idx_search_cache_query
            tableName: plantnet_search_cache
            columns:
              - column:
                  name: query