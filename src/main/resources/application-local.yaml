# ===========================================
# Peony Application - Local Development Config
# ===========================================
# This configuration file is meant for local testing and development.
# It provides sensible defaults while allowing customization via environment variables.

spring:
  application:
    name: peony

  # DataSource configuration - PostgreSQL connection details
  datasource:
    # Use environment variable with default to localhost:5432
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:peony}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # Connection pool settings for development
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Liquibase for database migrations - enabled by default
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
    contexts: dev
    # Log SQL changes during development (configure via standard logging instead)

  # PlantNet API configuration
  plantnet:
    use-authentication: false
    # Use environment variable or leave empty for free tier public API
    api-key: ${PLANTNET_API_KEY:}
    timeout-seconds: 30
    api-timeout: 30000
    # Enable retry logic for rate limit handling
    retry-attempts: 3
    retry-delay: 5000

  # Caching configuration for PlantNet API rate limit mitigation
  cache:
    type: caffeine
    
    caffeine:
      spec: >
        maxSize=100,
        expireAfterWrite(${CACHE_EXPIRE_MINUTES:60}, java.util.concurrent.TimeUnit.MINUTES),
        initialCapacity=25,
        maximumSize=100,
        expireAfterAccess(${CACHE_ACCESS_TTL_MINUTES:30}, java.util.concurrent.TimeUnit.MINUTES)

    # Database-backed caching configuration (persistent storage)
    # This is for permanent storage - NOT a temporary cache. TTL applies only to L1 caffeine/redis caches.
    db-backed:
      enabled: true
      # No TTL here - database stores data permanently until explicitly deleted

    # Redis configuration for distributed caching (optional, disabled by default in local dev)
    redis:
      enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout-seconds: 5

# Server configuration
server:
  port: ${PORT:8080}
  # Enable Swagger/OpenAPI docs for local testing
  swagger:
    enabled: true
  
# Actuator for health checks and metrics (useful for local development)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true

# Logging configuration for local development
logging:
  level:
    root: INFO
    com.dendi: DEBUG
    org.springframework.web: DEBUG
    com.zaxxer.np.cachex: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific settings for local testing
app:
  profile: local
  debug-mode: true
  # Enable verbose error messages in development
  stacktrace-enabled: true
