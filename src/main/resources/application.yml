# Peony Application - Main Configuration
spring:
  application:
    name: peony

  # DataSource configuration
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:peony}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Liquibase for database migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

  # Issue #44: recognition and personal-photo uploads share the 1 MiB cap.
  servlet:
    multipart:
      max-file-size: 1MB

# ==================== Swagger/OpenAPI Configuration ====================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    default-expanded: false
  # Custom path configuration
  paths-to-match:
    - /**

# ==================== PlantNet API Configuration ====================
plantnet:
  api-key: ${PLANTNET_API_KEY:}
  retry-attempts: 5
  retry-base-delay-ms: 1000

# ==================== Application Configuration ====================
# JWT (spec #17, session -> JWT cutover): the signing secret has no default on purpose - a
# blank secret fails startup (see JwtProperties) so the app can never sign tokens without a
# key. The local and test profiles supply a development secret; every other environment sets
# JWT_SECRET.
peony:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  # Issue #24: browser CORS allowlist for the Expo web app, comma-separated origins via
  # PEONY_CORS_ALLOWED_ORIGINS. Empty disables CORS (no CORS headers). The local profile allows
  # the Expo web dev server at http://localhost:8081; production should set its web-app origin,
  # documented placeholder https://app.peony.example.com until the domain is chosen.
  cors:
    allowed-origins: ${PEONY_CORS_ALLOWED_ORIGINS:}
  # Issue #10: the thumbnail and gallery endpoints serve image files from this directory.
  # Files are seeded by the dataset (#9); the directory is relative to the working dir unless
  # overridden via PEONY_PLANT_IMAGES_DIR.
  plant-images:
    dir: ${PEONY_PLANT_IMAGES_DIR:plant-images}
  # Issue #44 (ADR-008): private per-individual photos, display and thumbnail JPEGs. The
  # directory is relative to the working dir unless overridden via PEONY_USER_IMAGES_DIR.
  user-images:
    dir: ${PEONY_USER_IMAGES_DIR:user-images}
  # Issue #45 (ADR-008): how long a recognized PlantNet species-image candidate stays available
  # to fill an image-less catalogue entry. Rows older than this are pruned.
  plantnet-staging:
    ttl: ${PEONY_PLANTNET_STAGING_TTL:7d}
  # Issue #45 (ADR-008): the only origin the backend downloads species images from. Keep this
  # narrow; an upstream-controlled URL must never turn into an SSRF primitive.
  plantnet-image:
    allowed-origin: ${PEONY_PLANTNET_IMAGE_ALLOWED_ORIGIN:https://bs.plantnet.org}
  # Issue #9: one-shot curated-dataset seeder. Off by default so a normal start never writes to
  # the catalogue. Run it with --spring.main.web-application-type=none and
  # --peony.dataset.seed.enabled=true; see docs/runbooks/dataset-seed.md.
  dataset:
    seed:
      enabled: ${PEONY_DATASET_SEED_ENABLED:false}
    images:
      # Issue #9 follow-up: one-shot curated catalogue image seeder. Runs after the plant
      # seed (order 2) and is off by default; see docs/runbooks/dataset-images.md.
      enabled: ${PEONY_DATASET_IMAGES_ENABLED:false}
      long-edge: ${PEONY_DATASET_IMAGES_LONG_EDGE:512}
      # Pause between downloads; Wikimedia rate-limits rapid callers (HTTP 429). The downloader
      # also retries 429/5xx with backoff and honours Retry-After.
      request-interval-ms: ${PEONY_DATASET_IMAGES_REQUEST_INTERVAL_MS:500}
      file: ${PEONY_DATASET_IMAGES_FILE:dataset/catalogue-images.json}

# ==================== Application Settings ====================
server:
  port: ${PORT:8080}
