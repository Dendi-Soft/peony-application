# Peony Application - Main Configuration
spring:
  application:
    name: peony

  # DataSource configuration
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:peony}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Liquibase for database migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

# ==================== Swagger/OpenAPI Configuration ====================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    default-expanded: false
  # Custom path configuration
  paths-to-match:
    - /**

# ==================== PlantNet API Configuration ====================
plantnet:
  api-key: ${PLANTNET_API_KEY:}
  retry-attempts: 5
  retry-base-delay-ms: 1000

# ==================== Application Configuration ====================
# JWT (spec #17, session -> JWT cutover): the signing secret has no default on purpose - a
# blank secret fails startup (see JwtProperties) so the app can never sign tokens without a
# key. The local and test profiles supply a development secret; every other environment sets
# JWT_SECRET.
peony:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  # Issue #10: the thumbnail and gallery endpoints serve image files from this directory.
  # Files are seeded by the dataset (#9); the directory is relative to the working dir unless
  # overridden via PEONY_PLANT_IMAGES_DIR.
  plant-images:
    dir: ${PEONY_PLANT_IMAGES_DIR:plant-images}

# ==================== Application Settings ====================
server:
  port: ${PORT:8080}
