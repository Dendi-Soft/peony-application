spring:
  application:
    name: peony

  # DataSource configuration
  datasource:
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # Liquibase for database migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

  # PlantNet API configuration
  plantnet:
    use-authentication: false
    api-key: ${PLANTNET_API_KEY:}
    timeout-seconds: 30
    api-timeout: 30000

  # Caching configuration for PlantNet API rate limit mitigation
  cache:
    type: caffeine
    caffeine:
      spec: >
        maxSize=100,
        expireAfterWrite(${CACHE_EXPIRE_MINUTES:60}, java.util.concurrent.TimeUnit.MINUTES),
        initialCapacity=25,
        maximumSize=100,
        expireAfterAccess(${CACHE_ACCESS_TTL_MINUTES:30}, java.util.concurrent.TimeUnit.MINUTES)

    # Database-backed caching configuration (persistent storage)
    # This is for permanent storage - NOT a temporary cache. TTL applies only to L1 caffeine/redis caches.
    db-backed:
      enabled: true
      # No TTL here - database stores data permanently until explicitly deleted

    # Redis configuration for distributed caching (optional)
    redis:
      enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout-seconds: 5

# Server configuration
server:
  port: ${PORT:8080}

# PlantNet API rate limit info (free tier: 5 requests/minute)
info:
  plantnet:
    api-limit: "5 requests per minute on free tier"
    upgrade-info: "Consider upgrading to PRO or implementing caching for production use"
