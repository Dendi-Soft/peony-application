openapi: 3.0.3
info:
  title: Peony API
  version: 0.2.0
  description: |
    The Peony v1 API contract. This spec is the single source of truth for the wire
    contract: the Gradle build generates the shared DTOs into `com.dendi.peony.api.model`
    (models only, no API client) from this file, and the endpoint implementations build to
    it.

    The recognition endpoint is documented exactly as the merged code exposes it, including
    the tier and capability fields of issue #12. The plants CRUD, location, and auth
    endpoints are pinned here so issue #10 builds to the same contract. Field visibility
    between tiers follows `docs/api-tier-contracts.md`.

    All routes live under the `/api/v1/` prefix. Per ADR-004
    (`docs/adr/api-versioning-adr.md`), the entire API moved under the prefix in one
    change when the plants family shipped; this spec is the single versioning vehicle,
    so a breaking change is a new version here, not an in-place path edit.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: plants
    description: Plant records (typahead, registration, detail, notes)
  - name: locations
    description: Plant location management (nested house -> room)
  - name: images
    description: Plant image serving (thumbnail and gallery)
  - name: recognition
    description: Plant recognition from images
  - name: auth
    description: Account auth and subscription tier
paths:
  /api/v1/plantrecognition/recognize:
    post:
      tags:
        - recognition
      operationId: recognizePlant
      summary: Recognize a plant from an image
      description: |
        Identifies a plant using the PlantNet v2 identify API. The image is provided
        either as a multipart `file` part or a base64-encoded `base64Image` query
        parameter; exactly one of the two must be provided. `format` is an optional
        query parameter defaulting to `image/jpeg`. Both `multipart/form-data` and
        `application/json` requests are accepted: the JSON body is not read by the
        server, so with the JSON alternative the image travels in the `base64Image`
        query parameter. WebP images are converted to JPEG before being forwarded to
        PlantNet.

        Tier behavior: free-tier accounts receive basic results (the top hit only, with
        the species reduced to its scientific name and common names) and a monthly upload
        limit of 5; premium-tier accounts receive the complete result and have no monthly
        limit. Both responses carry `tier` and the tier's `capabilities`. Premium-only
        fields are omitted from free-tier responses (absent, not null).

        Retry behavior (ADR-002): PlantNet 429/503 responses and network failures are
        retried with exponential backoff (default 5 attempts, 1 s base delay, doubling per
        attempt, capped at 30 s) before the error is surfaced. The free-tier upload limit
        is checked before any PlantNet call.
      security:
        - bearerAuth: []
      parameters:
        - name: base64Image
          in: query
          required: false
          description: Base64-encoded image. Alternative to the multipart file part.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Media type of the image, e.g. "image/jpeg".
          schema:
            type: string
            default: image/jpeg
      requestBody:
        description: |
          The image as a multipart `file` part, or an ignored JSON body when the image
          is supplied via the `base64Image` query parameter.
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, or WebP). Alternative to base64Image.
          application/json:
            schema:
              type: object
              description: Not read by the server; base64Image and format travel as query parameters.
      responses:
        '200':
          description: Recognition successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantRecognitionResult'
              examples:
                freeTier:
                  summary: Free-tier basic shape (premium-only fields absent)
                  value:
                    successful: true
                    api_version: '2025-01-17'
                    hits:
                      - score: 0.9
                        species:
                          scientificName: Ajuga reptans L.
                          commonNames:
                            - Carpet bugle
                    tier: free
                    capabilities:
                      - PLANTS_READ
                      - PLANTS_CREATE
                      - PLANTS_UPDATE_NOTES
                      - RECOGNITION_BASIC
                premiumTier:
                  summary: Premium-tier complete shape
                  value:
                    successful: true
                    api_version: '2025-01-17'
                    hits:
                      - score: 0.9
                        species:
                          scientificName: Ajuga reptans L.
                          scientificNameWithoutAuthor: Ajuga reptans
                          scientificNameAuthorship: 'L.'
                          genus:
                            scientificName: Ajuga
                          family:
                            scientificName: Lamiaceae
                          commonNames:
                            - Carpet bugle
                        gbif:
                          id: '2868390'
                        powo:
                          id: 30010088-2
                    remaining_identification_requests: 42
                    tier: premium
                    capabilities:
                      - PLANTS_READ
                      - PLANTS_CREATE
                      - PLANTS_UPDATE_NOTES
                      - RECOGNITION_COMPLETE
                      - MULTI_DEVICE_SYNC
                      - ADVANCED_ANALYTICS
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Either a file upload or a base64-encoded image is required.
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '415':
          description: Unsupported image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Image bytes are not a WebP image. Supported uploads: JPEG, PNG, WebP."
        '429':
          description: Upload limit exceeded (free tier) or PlantNet API rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                freeTierLimit:
                  value:
                    error: >-
                      Free tier limit of 5 photo uploads per month reached. Upgrade to
                      premium for unlimited uploads.
                plantNetRateLimit:
                  value:
                    error: PlantNet API rate limit exceeded. Please wait a moment and try again.
        '502':
          description: PlantNet API unavailable or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                plantNetUnavailable:
                  value:
                    error: PlantNet API is temporarily unavailable. Please try again later.
                plantNetUnreachable:
                  value:
                    error: PlantNet API is unreachable. Please try again later.
  /api/v1/plants:
    get:
      tags:
        - plants
      operationId: listPlants
      summary: Search plants (typahead)
      description: |
        Typahead search over plant names, scientific names, and tags. Responses respect
        tier field visibility: free-tier users get the free field set per plant,
        premium-tier users get the full plant object.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Typahead query matched against names, scientific names, and tags.
          schema:
            type: string
      responses:
        '200':
          description: Matching plants, tier-filtered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
    post:
      tags:
        - plants
      operationId: createPlant
      summary: Register a plant manually
      description: |
        Registers a plant. Writes accept the full field set regardless of tier; the
        response is filtered to the requesting user's tier.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantRequest'
      responses:
        '201':
          description: Plant created, tier-filtered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
  /api/v1/plants/{plantId}:
    get:
      tags:
        - plants
      operationId: getPlant
      summary: Get a plant
      description: Returns the plant filtered to the requesting user's tier.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
      responses:
        '200':
          description: Plant, tier-filtered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/plants/{plantId}/notes:
    patch:
      tags:
        - plants
      operationId: updatePlantNotes
      summary: Update the per-plant notes
      description: Updates the user's note for the plant; identical shape in both tiers.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantNotes'
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantNotes'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/plants/{plantId}/locations/houses:
    post:
      tags:
        - locations
      operationId: createHouse
      summary: Create a house for the plant's locations
      description: |
        Creates a house (top-level location) for the plant. Location endpoints are not
        tier-gated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseRequest'
      responses:
        '201':
          description: House created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/houses/{houseId}/rooms:
    post:
      tags:
        - locations
      operationId: createRoom
      summary: Create a room in a house
      security:
        - bearerAuth: []
      parameters:
        - name: houseId
          in: path
          required: true
          description: Id of the house the room belongs to.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: House not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/plants/{plantId}/locations:
    post:
      tags:
        - locations
      operationId: assignPlantLocation
      summary: Assign a room to the plant
      description: Assigns the plant to a room; a plant can be in multiple locations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPlantLocationRequest'
      responses:
        '201':
          description: Location assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantLocationResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant or room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The plant is already assigned to the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - locations
      operationId: listPlantLocations
      summary: List the plant's locations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
      responses:
        '200':
          description: The plant's locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantLocationResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/plants/{plantId}/thumb:
    get:
      tags:
        - images
      operationId: getPlantThumb
      summary: Get the plant's thumbnail image
      description: |
        Serves the first gallery image (position 0) as the thumbnail. Image files live on
        disk (seeded by the dataset, issue #9); the plant_images table maps the plant to
        its files.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
      responses:
        '200':
          description: The thumbnail image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant or image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/plants/{plantId}/gallery/{index}:
    get:
      tags:
        - images
      operationId: getPlantGalleryImage
      summary: Get a gallery image by position
      description: Serves the gallery image at the given 0-based position.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlantId'
        - name: index
          in: path
          required: true
          description: 0-based position of the image in the plant's gallery.
          schema:
            type: integer
      responses:
        '200':
          description: The gallery image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '404':
          description: Plant, image, or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/signup:
    post:
      tags:
        - auth
      operationId: signup
      summary: Create a new account
      description: Creates a free-tier account. The password is stored hashed.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/signin:
    post:
      tags:
        - auth
      operationId: signin
      summary: Sign in
      description: |
        Validates credentials and returns a JWT access token plus an opaque refresh token.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Signed in, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/profile:
    get:
      tags:
        - auth
      operationId: getProfile
      summary: Current user profile
      description: Returns the signed-in user with tier and capability flags.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshTokens
      summary: Exchange a refresh token for new access and refresh tokens
      description: |
        POST to this endpoint with a valid refresh token in the body returns fresh JWT pairs. The old
        refresh token is revoked (spec #17 rotation). Include the opaque refresh token obtained from
        signin as `refreshToken` in the request body.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              valid-request:
                summary: Valid refresh token exchange
                value:
                  refreshToken: 8f14e45fceea167a5a36dedd4bea2543c1f7f0d2e7a4b8c9d0e1f2a3b4c5d6e7
      responses:
        '200':
          description: New access and refresh tokens issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: 8f14e45fceea167a5a36dedd4bea2543c1f7f0d2e7a4b8c9d0e1f2a3b4c5d6e7
                profile:
                  id: 123
                  username: testuser
                  email: test@example.com
                  tier: FREE
                  capabilities: ['READ', 'CREATE']
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
  /api/v1/subscription/upgrade:
    post:
      tags:
        - auth
      operationId: upgradeSubscription
      summary: Upgrade to premium
      description: Moves the signed-in account to the premium tier. Idempotent. No payment.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account is premium
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication for the JWT-based auth system (spec #17).
        The authorization header format is {@code Authorization: Bearer <token>}.
        Access tokens are issued on signup and signin; refresh tokens can be used at POST /api/v1/auth/refresh.
  parameters:
    PlantId:
      name: plantId
      in: path
      required: true
      description: Id of the plant.
      schema:
        type: integer
        format: int64
  schemas:
    PlantRecognitionResult:
      type: object
      description: |
        Recognition result shaped for the caller's tier. Null fields are omitted from the
        JSON, which is how the free-tier basic shape drops the premium-only fields
        (absent, not null): hits[].species.scientificNameWithoutAuthor,
        hits[].species.scientificNameAuthorship, hits[].species.genus,
        hits[].species.family, hits[].gbif, hits[].powo, and
        remaining_identification_requests.
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      required:
        - successful
        - api_version
        - hits
        - tier
        - capabilities
      properties:
        successful:
          type: boolean
          default: true
          description: Whether the PlantNet API reported the identification as successful.
        hits:
          type: array
          description: Prediction results, best match first.
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonAlias("results")'
          items:
            $ref: '#/components/schemas/HitResponse'
        api_version:
          type: string
          description: PlantNet API/model version used for the identification (e.g., "2025-01-17").
        remaining_identification_requests:
          type: integer
          format: int32
          description: Remaining identification requests for the current period (premium tier; omitted for free tier).
        tier:
          type: string
          enum:
            - free
            - premium
          description: Access tier of the calling account, in lowercase.
        capabilities:
          type: array
          description: Capability flags granted to the calling account's tier.
          items:
            type: string
            enum:
              - PLANTS_READ
              - PLANTS_CREATE
              - PLANTS_UPDATE_NOTES
              - RECOGNITION_BASIC
              - RECOGNITION_COMPLETE
              - MULTI_DEVICE_SYNC
              - ADVANCED_ANALYTICS
    HitResponse:
      type: object
      description: Individual prediction from the PlantNet API; results are ordered best match first.
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      required:
        - score
        - species
      properties:
        score:
          type: number
          format: double
          default: 0.0
          description: Confidence score for this hit (0.0 to 1.0).
        species:
          $ref: '#/components/schemas/Species'
        gbif:
          $ref: '#/components/schemas/Gbif'
        powo:
          $ref: '#/components/schemas/Powo'
    Species:
      type: object
      description: Species information matching the PlantNet API response structure.
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      required:
        - scientificName
      properties:
        scientificName:
          type: string
          description: Full scientific name including authority (e.g., "Caladium bicolor (Aiton) Vent.").
        scientificNameWithoutAuthor:
          type: string
          description: Scientific name without authority (e.g., "Caladium bicolor").
        scientificNameAuthorship:
          type: string
          description: Authority part of the name (e.g., "(Aiton) Vent.").
        genus:
          $ref: '#/components/schemas/Genus'
        family:
          $ref: '#/components/schemas/Family'
        commonNames:
          type: array
          description: Common names (e.g., ["Heart of Jesus", "Caladium"]).
          items:
            type: string
    Genus:
      type: object
      description: Genus information matching the PlantNet API response structure.
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      properties:
        scientificName:
          type: string
          description: Full scientific name (e.g., "Caladium").
        scientificNameWithoutAuthor:
          type: string
          description: Scientific name without authority (e.g., "Caladium").
        scientificNameAuthorship:
          type: string
