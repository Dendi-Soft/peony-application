plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'checkstyle'
}

group = 'com.dendi'
version = '0.0.1-SNAPSHOT'
description = 'peony'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '12.1.2'
    configFile = file("$rootDir/checkstyle.xml")
    showViolations = true
    ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    configProperties = [
            'org.checkstyle.google.suppressionfilter.config': file("$rootDir/checkstyle-suppressions.xml").absolutePath
    ]
}

checkstyleMain {
    source = fileTree('src/main/java')
}

checkstyleTest {
    source = fileTree('src/test/java')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // OpenAPI Swagger - API documentation generation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // PlantNet API integration - OkHttp for HTTP requests and Jackson for JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'
    
    // Caffeine for in-memory caching (essential for rate limiting)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Spring Boot Actuator for health checks and metrics (required for Docker compose healthcheck)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Redis support for distributed caching (optional, when enabled in application.yaml)
    def redisEnabled = Boolean.parseBoolean(System.getProperty('spring.redis.enabled', 'false'))
    if (redisEnabled) {
      implementation 'org.springframework.boot:spring-boot-starter-data-redis'
      runtimeOnly 'io.lettuce:lettuce-core:6.3.1.RELEASE'  // Modern version with auto-update
    }
    
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        targetExclude 'build/generated/**/*.java'
        googleJavaFormat('1.32.0')
        removeUnusedImports()
        importOrder()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('checkstyleMain') {
    dependsOn 'spotlessApply'
}
tasks.named('checkstyleTest') {
    dependsOn 'spotlessApply'
}

