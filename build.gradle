plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'checkstyle'
    id 'org.openapi.generator' version '7.26.0'
}

group = 'com.dendi'
version = '0.0.1-SNAPSHOT'
description = 'peony'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Generate the API DTOs from the authored OpenAPI contract (issue #13). Models only - the
// spec is the single source of truth for the wire contract, and the generated classes are
// never hand-edited.
openApiGenerate {
    generatorName = 'java'
    inputSpec = "$rootDir/openapi/peony-api.yaml"
    outputDir = "$rootDir/build/generated/openapi"
    modelPackage = 'com.dendi.peony.api.model'
    // 'retrofit2' uses the generator's base POJO template (Jackson serialization, standalone
    // classes). The default 'okhttp-gson' would force Gson annotations, and 'native' emits POJOs
    // that reference the ApiClient invoker class (not generated in models-only mode).
    library = 'retrofit2'
    // In 7.26.0 these global properties are CSV whitelists: setting one turns its category
    // on and forces the rest off. 'models' = '' means "all models"; the rest are off.
    globalProperties = [
            apis: '',
            models: '',
            apiTests: 'false',
            apiDocs: 'false',
            modelDocs: 'false',
            modelTests: 'false',
            supportingFiles: 'false'
    ]
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
            serializationLibrary: 'jackson',
            openApiNullable: 'false',
            // java8-localdatetime emits java.time.LocalDateTime for date-time fields, matching
            // the entities (TIMESTAMP columns) so responses need no zone conversion.
            dateLibrary: 'java8-localdatetime',
            serializableModel: 'false'
    ]
}

sourceSets {
    main {
        java {
            srcDir "$rootDir/build/generated/openapi/src/main/java"
        }
    }
}

// Exclude generated API interfaces (retrofit-based) since we use hand-written services
tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
    // Only compile models, not the retrofit API interfaces
    exclude '**/org/openapitools/client/api/*.java'
}

checkstyle {
    toolVersion = '12.1.2'
    configFile = file("$rootDir/checkstyle.xml")
    showViolations = true
    ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    configProperties = [
            'org.checkstyle.google.suppressionfilter.config': file("$rootDir/checkstyle-suppressions.xml").absolutePath
    ]
}

checkstyleMain {
    source = fileTree('src/main/java')
}

checkstyleTest {
    source = fileTree('src/test/java')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Session-based auth (T12): server-side sessions, BCrypt password hashing
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // OpenAPI Swagger - API documentation generation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // PlantNet API integration - OkHttp for HTTP requests and Jackson for JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // Annotations referenced by the OpenAPI-generated POJOs: Nonnull/Nullable (JSR-305) and
    // Generated (JSR-250). Compile-time markers only; not used by Jackson.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // WebP decoding via ImageIO for image uploads
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'

    // Spring Boot Actuator for health checks and metrics (required for Docker compose healthcheck)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Auth0 JWT library for token signing/validating (spec #17)
    implementation group: 'com.auth0', name: 'java-jwt', version: '4.4.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        targetExclude 'build/generated/**/*.java'
        googleJavaFormat('1.32.0')
        removeUnusedImports()
        importOrder()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('checkstyleMain') {
    dependsOn 'spotlessApply'
}
tasks.named('checkstyleTest') {
    dependsOn 'spotlessApply'
}

